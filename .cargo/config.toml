include = [
    { path = "target-dir.local.toml", optional = true },
    { path = "release-profile.local.toml", optional = true },
]

# rust-lld instead of MSVC's link.exe: no `link.exe` on PATH is needed, and the link step of
# this tree is where a rebuild's seconds go.
#
# What everything compiled from source in this tree is built for: SSE4.2, SSSE3, POPCNT and
# CMPXCHG16B, rather than the 2003 baseline an executable of this target otherwise carries.
# The precompiled `std` is not rebuilt, so nothing inside the standard library gains them;
# what does is this crate, every dependency compiled here and their build scripts. The C
# engines built beside them are compiled by `cc` and never see a Rust flag.
#
# v2 and not the AVX2 a Haswell (2013) has: that is the level no machine is left out by.
# Every processor Windows 11 supports is above it, while v3 would exclude an ARM64 Windows
# device, which runs this executable under emulation that reaches AVX2 only from 24H2. A
# `RUSTFLAGS` in the environment would replace this list rather than add to it, which is why
# neither workflow sets one.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
rustflags = ["-C", "target-cpu=x86-64-v2"]
