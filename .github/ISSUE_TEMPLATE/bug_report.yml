name: Bug report
description: Something isn't working? Tell us what happened.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the sections below.
        If this is a security problem, see SECURITY.md instead of opening a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong? What did you expect to happen instead?
      placeholder: "Example: Discord stays muted after I switch back to it, but I expected it to become audible again."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Tell us how to see the bug. Numbered steps work best.
      placeholder: |
        1. Start the app with muting enabled
        2. Play music in Spotify
        3. Switch to Steam
        4. Switch back to Spotify
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Which release are you using? (See the installer name on the Releases page, e.g. 0.1.2.)
      placeholder: "Example: 0.1.2"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Press Win+R, type winver, and paste the version here.
      placeholder: "Example: Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, your exclusion lists, or anything unusual about your setup. Remove private info first.
      placeholder: "Optional. Example: Only happens with apps that use several audio sessions."
    validations:
      required: false
