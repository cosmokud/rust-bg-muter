[package]
name = "rust-bg-muter"
version = "0.1.2"
edition = "2021"
authors = ["Background Muter Team"]
description = "A lightweight Windows application to mute background applications"
license = "MIT"
repository = "https://github.com/username/rust-bg-muter"

[dependencies]
# Windows API bindings
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
]}

# System tray (lightweight)
tray-icon = "0.19"

# Image handling for tray icon (minimal features)
image = { version = "0.25", default-features = false, features = ["png"] }

# Serialization for config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cross-thread communication (lightweight)
crossbeam-channel = "0.5"

# Logging (minimal)
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }

# Directories for config storage
dirs = "5.0"

# Parking lot for better mutexes
parking_lot = "0.12"

[build-dependencies]
winres = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
ico = "0.3"

[profile.release]
opt-level = "z"      # Optimize for size
lto = true           # Link-time optimization
codegen-units = 1    # Single codegen unit for better optimization
panic = "abort"      # Abort on panic (smaller binary)
strip = true         # Strip all symbols

[profile.dev]
opt-level = 1        # Some optimization in dev for faster iteration

[[bin]]
name = "rust-bg-muter"
path = "src/main.rs"

[package.metadata.winres]
OriginalFilename = "rust-bg-muter.exe"
ProductName = "Background Muter"
FileDescription = "Mute background applications automatically"

[package.metadata.packager]
product-name = "Background Muter"
identifier = "dev.rust-bg-muter.app"
publisher = "Background Muter Team"
description = "Automatically mute background applications while the active one stays audible"
license-file = "LICENSE"
icons = ["assets/icon.ico"]
formats = ["nsis"]
out-dir = "target/packager"
binaries-dir = "target/release"

[[package.metadata.packager.binaries]]
path = "rust-bg-muter"
main = true

[package.metadata.packager.nsis]
installMode = "currentUser"
template = "packaging/nsis/installer.nsi"
installer-icon = "assets/icon.ico"
appdata-paths = ["$APPDATA/rust-bg-muter"]
preinstall-section = '''
Section PreInstall
  ; Keep the per-user install at AppData\Local\rust-bg-muter rather than at a folder
  ; named after the display name. Only the default is moved: a directory picked on the
  ; installer's own page is left where it was chosen.
  !if "${INSTALLMODE}" == "currentUser"
    StrCmp $INSTDIR "$LOCALAPPDATA\${PRODUCTNAME}" 0 +2
    StrCpy $INSTDIR "$LOCALAPPDATA\rust-bg-muter"
  !endif
SectionEnd
'''
