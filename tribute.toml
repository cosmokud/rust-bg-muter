# Third-party attribution, generated by `cargo tribute`
# (https://crates.io/crates/cargo-tribute). `cargo tribute` refreshes LICENSES/,
# NOTICES/ and THIRD-PARTY.md from the Cargo dependency tree; `cargo tribute
# --check` exits 2 when what is committed no longer matches that tree.
#
# Everything here is a deliberate departure from the defaults, and nothing else
# is: the accepted list below is the default one minus BSD-2-Clause and ISC (no
# Windows dependency uses either), and the entry after it is the crate those
# defaults do not describe correctly.

# The allowlist, and the order an `A OR B` expression is read in: the first
# entry an expression can be satisfied by is the license attributed.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "0BSD",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
]

# This app is Windows-only, while `tray-icon` and `dirs` also resolve GTK, macOS
# and generic-object crates that are never compiled into the binary (and whose
# licenses, ISC and BSD-2-Clause among them, would otherwise have to be
# attributed). Pinned to the target CI and the release build use, so the notice
# lists what is actually linked instead of everything the lockfile mentions.
filter-platform = ["x86_64-pc-windows-msvc"]

# MPL-2.0 is a file-level copyleft, and the one crate under it arrives through
# `dirs` (with `dirs-sys` beneath it). Scoped to that crate so the exception
# stays visible instead of widening `accepted` for every dependency this
# project ever takes on.
[[exception]]
name = "option-ext"
allow = ["MPL-2.0"]
